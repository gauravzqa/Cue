[project]
name = "daa"
version = "0.1.0"
description = "Voice-driven macOS assistant: DeepSeek converses, Jev judges, typed tools act."
requires-python = ">=3.12,<3.13"
dependencies = [
    "typesafe-sdk>=0.7.0",
    "openai>=2.36",          # DeepSeek via the OpenAI-compatible endpoint
    "python-dotenv>=1.0",
    "pyobjc-framework-Cocoa>=10.3 ; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz>=10.3 ; sys_platform == 'darwin'",
    "pyobjc-framework-ApplicationServices>=10.3 ; sys_platform == 'darwin'",
]

[project.optional-dependencies]
voice = ["sounddevice>=0.4.7", "numpy>=1.26", "silero-vad>=5.1", "torch>=2.2"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "ruff>=0.6"]

[project.scripts]
daa = "daa.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/daa"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Anything touching the real machine or a real API must be opted into.
markers = [
    "live: hits a real external API (needs TYPESAFE_API_KEY / DEEPSEEK_API_KEY)",
    "macos: mutates real local state or needs TCC permissions",
]
addopts = "-m 'not live and not macos' -q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
